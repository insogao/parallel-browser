<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backlight · 浏览器体验页</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#243d34;font:16px/1.7 -apple-system,"PingFang SC",sans-serif}nav{padding:22px 6%;display:flex;align-items:center;gap:12px;border-bottom:1px solid #dce4d7;font-size:12px;letter-spacing:2px}.logo{display:grid;place-items:center;width:35px;height:35px;background:#244c3d;color:#d8f9ca;border-radius:10px;font-size:24px;font-weight:600;letter-spacing:0}nav a{margin-left:auto;color:#59755f;text-decoration:none;letter-spacing:0}main{max-width:1000px;margin:55px auto;padding:0 40px}.eyebrow{font-size:12px;letter-spacing:2px;color:#7a9275}h1{font-size:clamp(30px,4vw,54px);line-height:1.35;letter-spacing:-2px;max-width:700px;margin:18px 0 22px}h1 em{font-style:normal;color:#789769}.lead{max-width:530px;color:#75836d;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:42px}section{padding:24px;border:1px solid #dce5d8;border-radius:18px;background:#fff}h2{font-size:18px;font-weight:600;margin:10px 0}p{font-size:14px;color:#788672}.tag{font-size:10px;letter-spacing:1px;color:#748867}input{width:100%;border:1px solid #dce5d8;background:#f6f8f3;padding:13px;border-radius:10px;font:inherit;font-size:13px}#clock{font-size:32px;font-variant-numeric:tabular-nums;color:#36624c;margin:18px 0 0}footer{margin:32px 0;color:#85927e;font-size:11px}@media(max-width:650px){main{padding:0 22px}.grid{grid-template-columns:1fr}}
</style></head><body><nav><span class="logo">B</span> BACKLIGHT <a href="/">打开控制台 ↗</a></nav><main><span class="eyebrow">给 AI 一个安静工作的地方</span><h1>后台继续，<br><em>需要时，就在眼前。</em></h1><p class="lead">这是浏览器的本地体验页。右侧扩展可以读取这个网页、改变标题样式，并保存自己的笔记。</p><div class="grid"><section><span class="tag">01 / 后台数据</span><h2>窗口收起，数据仍更新</h2><p>此处每秒向本机服务请求一次时间。最小化一会儿，再回来看看。</p><div id="clock">正在连接</div><p id="count">等待首次响应</p></section><section><span class="tag">02 / 人工接管</span><h2>保留你手上的操作</h2><p>输入一段草稿，保存扩展代码。扩展会单独重载，网页内容保持原状。</p><input id="draft" aria-label="测试草稿" placeholder="输入一段不想被打断的草稿…"></section></div><footer>本页不收集账号信息 · 数据请求仅发送到本机 Backlight 服务</footer></main><script>let count=0;async function tick(){try{const r=await fetch('/api/demo');if(!r.ok)throw Error();const d=await r.json();document.querySelector('#clock').textContent=new Date(d.now).toLocaleTimeString();document.querySelector('#count').textContent='已收到 '+(++count)+' 次响应'}catch{document.querySelector('#count').textContent='连接中断，稍后重试'}}tick();setInterval(tick,1000)</script></body></html>
